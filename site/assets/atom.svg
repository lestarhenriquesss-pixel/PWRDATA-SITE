<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <radialGradient id="nucleus">
      <stop offset="0" stop-color="#fff6e7"/>
      <stop offset=".38" stop-color="#ffd7a5"/>
      <stop offset="1" stop-color="#ff7a30"/>
    </radialGradient>
    <linearGradient id="orbit" x1="12" y1="25" x2="84" y2="71" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8b42"/>
      <stop offset=".5" stop-color="#ffe0b5"/>
      <stop offset="1" stop-color="#ff9e61"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#ff7a30" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ff7a30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .orbits{transform-origin:48px 48px;animation:spin 36s linear infinite}
    .core-halo{transform-origin:48px 48px;animation:breathe 4.8s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes breathe{50%{transform:scale(1.1);opacity:.65}}
    @media(prefers-reduced-motion:reduce){.orbits{animation-duration:70s}.core-halo{animation-duration:12s}}
  </style>
  <circle cx="48" cy="48" r="36" fill="url(#halo)" class="core-halo"/>
  <g class="orbits" stroke="url(#orbit)" stroke-width="2.15">
    <ellipse cx="48" cy="48" rx="36" ry="14"/>
    <ellipse cx="48" cy="48" rx="36" ry="14" transform="rotate(60 48 48)"/>
    <ellipse cx="48" cy="48" rx="36" ry="14" transform="rotate(120 48 48)"/>
    <g stroke="none">
      <circle r="3.1" fill="#ffe3bb"><animateMotion dur="5.8s" repeatCount="indefinite" path="M84 48 A36 14 0 1 0 12 48 A36 14 0 1 0 84 48"/></circle>
      <g transform="rotate(60 48 48)"><circle r="2.8" fill="#ffac70"><animateMotion dur="7.2s" begin="-2.4s" repeatCount="indefinite" path="M84 48 A36 14 0 1 1 12 48 A36 14 0 1 1 84 48"/></circle></g>
      <g transform="rotate(120 48 48)"><circle r="2.8" fill="#ffdbab"><animateMotion dur="6.5s" begin="-4.1s" repeatCount="indefinite" path="M84 48 A36 14 0 1 0 12 48 A36 14 0 1 0 84 48"/></circle></g>
    </g>
  </g>
  <circle cx="48" cy="48" r="10" fill="#ff9b4f" fill-opacity=".14"/>
  <circle cx="48" cy="48" r="5.4" fill="url(#nucleus)"/>
</svg>
